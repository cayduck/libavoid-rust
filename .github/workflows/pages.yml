# Builds the interactive demo (demo/ + the web-target WASM package) and
# publishes it with GitHub Pages.  One-time setup: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".
name: Demo site

# Runs only when something the site is built from changes (not for
# documentation or tests); it can also be started by hand.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "demo/**"
      - "lib/**"
      - "index.mjs"
      - "scripts/**"
      - "Cargo.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wasm-pack (devDependency)
        run: npm ci

      - name: Build the web WASM package and assemble the site
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
