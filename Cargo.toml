[package]
name = "libavoid-rust"
version = "0.2.0"
edition = "2021"
authors = ["Cayduck"]
description = "Rust/WASM port of the libavoid connector-routing library (adaptagrams) with a JavaScript API"
license = "LGPL-2.1-or-later"
repository = "https://github.com/cayduck/libavoid-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
